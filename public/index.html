<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T2Climb Timer Control</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="app-container">
        <!-- Connection Panel -->
        <div class="connection-panel">
            <div class="connection-status">
                <div id="statusIndicator" class="status-dot disconnected"></div>
                <span id="statusText">Disconnected</span>
            </div>
            <button id="connectBtn" class="btn btn-primary">Connect to Display</button>
            <div id="deviceInfo" class="device-info hidden">
                <span id="deviceName"></span>
                <button id="disconnectBtn" class="btn btn-secondary">Disconnect</button>
            </div>
        </div>

        <div class="main-layout">
            <!-- Main Control Panel -->
            <section class="control-panel">
                <header class="panel-header">
                    <h1>T2Climb Timer Control</h1>
                </header>

                <!-- Mode & Status Display -->
                <div class="status-display">
                    <div class="mode-info">
                        <div class="label">Mode</div>
                        <div id="modeDisplay" class="value">--</div>
                    </div>
                    <div class="run-mode-info">
                        <div class="label">Run</div>
                        <div id="runModeDisplay" class="value">--</div>
                    </div>
                    <div class="timer-display">
                        <div id="timerValue">00:00.0</div>
                        <div class="timer-preview" id="timerPreview">
                            <div class="preview-chip">
                                <span class="preview-label">TRANS</span>
                                <span class="preview-value" id="transPreview">15s</span>
                            </div>
                            <div class="preview-chip">
                                <span class="preview-label">CLIMB</span>
                                <span class="preview-value" id="climbPreview">60s</span>
                            </div>
                            <div class="preview-chip preview-state">
                                <span class="preview-label">STATE</span>
                                <span class="preview-value" id="statePreview">⏸</span>
                            </div>
                        </div>
                        <div class="config-preview" id="configPreview">
                            <div class="preview-chip">
                                <span class="preview-label">TONE</span>
                                <span class="preview-value" id="tonePreview">--</span>
                            </div>
                            <div class="preview-chip">
                                <span class="preview-label">WAVE</span>
                                <span class="preview-value" id="wavePreview">--</span>
                            </div>
                            <div class="preview-chip">
                                <span class="preview-label">UI</span>
                                <span class="preview-value" id="uiPreview">--</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Main Control Buttons -->
                <div class="button-grid main-controls">
                    <button id="btn-start" class="btn btn-large btn-start" disabled>START</button>
                    <button id="btn-reset" class="btn btn-large btn-reset" disabled>RESET</button>
                    <button id="btn-abort" class="btn btn-large btn-abort mode-speed-only" disabled>ABORT</button>
                    <button id="btn-finish" class="btn btn-large btn-finish mode-boulder-only hidden" disabled>FINISH</button>
                </div>

                <!-- Judging Override (Speed Mode Only) -->
                <div class="judging-section mode-speed-only hidden">
                    <h3>Judging Override</h3>
                    <div class="button-grid">
                        <button id="btn-winner-a" class="btn btn-judge" disabled>WINNER A</button>
                        <button id="btn-winner-b" class="btn btn-judge" disabled>WINNER B</button>
                        <button id="btn-fall-a" class="btn btn-fall" disabled>FALL A</button>
                        <button id="btn-fall-b" class="btn btn-fall" disabled>FALL B</button>
                    </div>
                </div>

                <!-- Configuration Toggle -->
                <div class="panel-footer">
                    <button id="toggleConfig" class="btn btn-secondary">⚙️ Configuration</button>
                    <button id="toggleTerminal" class="btn btn-secondary">🔧 Debug Terminal</button>
                </div>
            </section>

            <!-- Configuration Panel -->
            <section id="configPanel" class="config-panel hidden">
                <header class="panel-header">
                    <h2>Configuration</h2>
                    <button id="closeConfig" class="btn-close">×</button>
                </header>

                <div class="config-section">
                    <details open>
                        <summary>Climb Settings</summary>
                        <div class="config-group">
                            <label>Climb Duration (seconds)</label>
                            <input type="number" id="cfg-climb" min="1" max="3600" value="60" />
                            
                            <label>Transition Duration (seconds)</label>
                            <input type="number" id="cfg-trans" min="0" max="3600" value="15" />
                        </div>
                    </details>

                    <details open>
                        <summary>Mode Selection</summary>
                        <div class="config-group">
                            <label>Climb Mode</label>
                            <select id="cfg-mode">
                                <option value="0">IFSC Speed</option>
                                <option value="1">Boulder</option>
                                <option value="2">Lead</option>
                                <option value="3">Clock</option>
                            </select>

                            <div id="runModeConfig" class="hidden">
                                <label>Run Mode</label>
                                <select id="cfg-runmode">
                                    <option value="0">Qualifications (Auto-Loop)</option>
                                    <option value="1">Finals (Referee)</option>
                                </select>
                            </div>
                        </div>
                    </details>

                    <details>
                        <summary>Audio & Display</summary>
                        <div class="config-group">
                            <label>Beeper Style</label>
                            <select id="cfg-beep-style">
                                <option value="0">IFSC Prague</option>
                                <option value="1">IFSC Innsbruck</option>
                                <option value="2">JMSCA Japan</option>
                            </select>

                            <label>Audio Waveform</label>
                            <select id="cfg-waveform">
                                <option value="0">Warm Sine (Smooth)</option>
                                <option value="1">Sharp Square (Aggressive)</option>
                            </select>

                            <label>Audio Volume: <span id="volDisplay">100</span>%</label>
                            <input type="range" id="cfg-vol" min="0" max="100" value="100" />
                        </div>
                    </details>

                    <details>
                        <summary>UI & Lanes</summary>
                        <div class="config-group">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" id="cfg-symbols" /> Use Symbols
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" id="cfg-tenths" /> Show Tenths
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" id="cfg-console" /> Console Output
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" id="cfg-maintenance" /> Maintenance Mode
                            </label>

                            <label>UI Theme</label>
                            <select id="cfg-theme">
                                <option value="0">Pro Dark (High Contrast)</option>
                                <option value="1">IFSC Official Colors</option>
                            </select>

                            <label>Active Lanes</label>
                            <div style="display: flex; gap: 20px; margin: 8px 0;">
                                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                    <input type="checkbox" id="cfg-lane-a" checked /> Lane A
                                </label>
                                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                    <input type="checkbox" id="cfg-lane-b" checked /> Lane B
                                </label>
                            </div>

                            <label>Unit Assigned Lane</label>
                            <select id="cfg-assigned-lane">
                                <option value="0">Global (Both)</option>
                                <option value="1">Lane A (Left)</option>
                                <option value="2">Lane B (Right)</option>
                            </select>
                        </div>
                    </details>
                </div>

                <div class="config-actions">
                    <button id="applyConfig" class="btn btn-primary">Apply Settings</button>
                    <button id="resetConfig" class="btn btn-secondary">Reset</button>
                </div>
            </section>

            <!-- Debug Terminal -->
            <section id="terminalPanel" class="terminal-panel hidden">
                <header class="panel-header">
                    <h2>Debug Terminal</h2>
                    <button id="closeTerminal" class="btn-close">×</button>
                </header>

                <div id="terminal" class="terminal"></div>

                <div class="terminal-input">
                    <input type="text" id="terminalInput" placeholder="Type command..." disabled />
                    <button id="terminalSend" class="btn btn-primary" disabled>Send</button>
                </div>

                <div class="terminal-actions">
                    <button id="terminalClear" class="btn btn-secondary">Clear</button>
                    <button id="terminalSave" class="btn btn-secondary">Save Log</button>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
