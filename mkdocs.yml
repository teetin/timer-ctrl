site_name: T2Climb Timer
site_description: Climber's guide and user manual for T2Climb timing system.
site_url: https://teetin.github.io/timer-ctrl/docs/

docs_dir: public/wiki
site_dir: public/docs

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

plugins:
  - search
  - i18n:
      reconfigure_material: true
      reconfigure_search: true
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fi
          name: Suomi
          build: true
          nav_translations:
            User Guide: Käyttöohje
            Quick Start: Pikaopas
            Disciplines: Lajit & Harjoittelu
            Speed: Nopeuskiipeily
            Boulder: Boulder
            Lead: Lead
            Intervals & Circuits: Intervallit
            Clock & Stopwatch: Kello & Sekuntikello
            Web App Guide: Selainsovellus
            Hardware Station: Ajastinyksikkö
            Technical Reference: Tekninen viiteopas
            Protocol & Commands: Protokolla ja komennot
            Events & BLE/API Specs: Tapahtumat ja API-määritykset

nav:
  - User Guide:
      - Quick Start: index.md
      - Disciplines:
          - Speed: speed.md
          - Boulder: boulder.md
          - Lead: lead.md
          - Intervals & Circuits: circuit.md
          - Clock & Stopwatch: clock.md
      - Web App Guide: Web-UI-Guide.md
      - Hardware Station: Hardware-Guide.md
  - Technical Reference:
      - Protocol & Commands: Technical-Reference.md
      - Events & BLE/API Specs: Events-Reference.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
