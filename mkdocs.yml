site_name: T2Climb Timer System Manual
site_description: Official user manual and documentation for T2Climb timing ecosystem.
site_url: https://teetin.github.io/timer-ctrl/docs/

docs_dir: public/wiki
site_dir: public/docs

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

nav:
  - Overview: Home.md
  - Disciplines & Modes:
      - Speed Climbing: Speed.md
      - Lead Climbing: Lead.md
      - Bouldering: Bouldering.md
      - Circuit Training: Circuit.md
      - Clock & Stopwatch: Clock.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
